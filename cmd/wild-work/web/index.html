<!doctype html>
<html lang="zh-CN" data-theme="porcelain-moss">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        const storageKey = "reso.theme"
        let mode = "system"
        try {
          mode = localStorage.getItem(storageKey) || "system"
        } catch {
          mode = "system"
        }
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches
        const theme =
          mode === "tungsten-dark" || (mode === "system" && prefersDark)
            ? "tungsten-dark"
            : "porcelain-moss"
        const root = document.documentElement
        root.dataset.theme = theme
        root.classList.toggle("dark", theme === "tungsten-dark")
        root.style.colorScheme = theme === "tungsten-dark" ? "dark" : "light"
      })()
    </script>
    <link rel="icon" href="./logo.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Reso 控制台 — 多渠道账号聚合 OpenAI 兼容网关"
    />
    <title>Reso · 控制台</title>
    <script type="module" crossorigin src="./assets/index-DELZ6pWj.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DjH54GTn.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.__errs = []
      window.addEventListener("error", (e) =>
        window.__errs.push(`${e.message} @${e.lineno}:${e.colno}`))
      window.addEventListener("unhandledrejection", (e) =>
        window.__errs.push(`promise: ${e.reason}`))
    </script>
  </body>
</html>
