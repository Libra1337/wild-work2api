services:
  wild-work:
    build: .
    container_name: wild-work
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    ports:
      # 容器内监听 0.0.0.0:7863；宿主机仅绑定回环，公网请走反代（见 README）
      - "127.0.0.1:7863:7863"
    volumes:
      - ./auths:/app/auths
      - ./data:/app/data
      - ./config.json:/app/config.json
